<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellMate UI Component Showcase</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        .webgl-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .webgl-error h1 {
            color: #ff5252;
            margin-bottom: 16px;
        }
        .webgl-error p {
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .webgl-error code {
            background: #2d2d2d;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <script>
        (function() {
            var canvas = document.createElement('canvas');
            var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            if (!gl) {
                document.body.innerHTML = '<div class="webgl-error">' +
                    '<h1>WebGL Required</h1>' +
                    '<p>This application requires WebGL to render graphics, but WebGL is not available in your browser.</p>' +
                    '<p>If you\'re using <strong>LibreWolf</strong> or a privacy-focused browser, WebGL may be disabled for fingerprint protection.</p>' +
                    '<p>To enable WebGL in LibreWolf:</p>' +
                    '<p>1. Open <code>about:config</code></p>' +
                    '<p>2. Search for <code>webgl.disabled</code></p>' +
                    '<p>3. Set it to <code>false</code></p>' +
                    '</div>';
                throw new Error('WebGL not available');
            }
        })();
    </script>
    <script>
        // Store-screenshot locale override. Compose Resources picks the locale from
        // navigator.languages; force it to the ?lang= param so we can render the
        // showcase in a specific locale (e.g. ?lang=pl) regardless of the host OS.
        // Must run BEFORE the wasm module loads and reads navigator.languages.
        (function () {
            var lang = new URLSearchParams(window.location.search).get('lang');
            if (!lang || !/^[a-z]{2}(-[A-Z]{2})?$/.test(lang)) return;  // only accept BCP-47-ish codes
            window.__customLocale = lang;
            function override(prop, value) {
                try {
                    Object.defineProperty(Navigator.prototype, prop, {
                        get: function () { return value; },
                        configurable: true
                    });
                } catch (e) { /* ignore */ }
            }
            override('languages', [lang]);
            override('language', lang);
        })();
    </script>
    <script src="wellmate-showcase.js"></script>
</body>
</html>
